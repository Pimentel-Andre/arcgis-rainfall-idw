name: Testar e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para o deploy no Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar outra, a anterior é cancelada.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testes-python:
    name: Testes do backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # Não há ArcGIS Pro no runner: os testes que precisam do ArcPy se pulam
      # sozinhos, e os de validação, classes, dados e API rodam.
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  construir:
    name: Testes e build do site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  publicar:
    name: Publicar no GitHub Pages
    needs: [testes-python, construir]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
